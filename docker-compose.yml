services:
  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./apps/gateway:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway
  gateway:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    volumes:
      - ./apps/gateway:/var/www/html
    depends_on:
      - postgres
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: "sudopay"
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: "sudopay"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
